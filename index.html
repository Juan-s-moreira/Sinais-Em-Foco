<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Projeto educacional para ensino de LIBRAS (Língua Brasileira de Sinais). Tradutor interativo de alfabeto e palavras."
    />
    <meta name="author" content="Juan Moreira" />
    <meta
      name="keywords"
      content="LIBRAS, Sinais, Educação, Acessibilidade, Alfabeto Manual"
    />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinais Em Foco - aprenda linguagem de sinais</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./assets/capa.png" type="image/x-icon" />
  </head>
  <body>
    <header>
      <h1>Sinais Em Foco</h1>
    </header>
    <main>
      <section id="hero">
        <p>
          Bem-vindo ao Sinais Em Foco! <br />
          Nosso objetivo é facilitar e levar o aprendizado da linguagem de
          sinais às pessoas.
        </p>
        <a href="#alfabeto" class="cta-btn">Comece Agora</a>
      </section>
      <section id="alfabeto">
        <div class="texto">
          <h2>Alfabeto Em Libras</h2>
        </div>
        <div class="alfabeto-content">
          <div class="alfabeto-container">
            <button class="letra" data-letra="a">A</button>
            <button class="letra" data-letra="b">B</button>
            <button class="letra" data-letra="c">C</button>
            <button class="letra" data-letra="d">D</button>
            <button class="letra" data-letra="e">E</button>
            <button class="letra" data-letra="f">F</button>
            <button class="letra" data-letra="g">G</button>
            <button class="letra" data-letra="h">H</button>
            <button class="letra" data-letra="i">I</button>
            <button class="letra" data-letra="j">J</button>
            <button class="letra" data-letra="k">K</button>
            <button class="letra" data-letra="l">L</button>
            <button class="letra" data-letra="m">M</button>
            <button class="letra" data-letra="n">N</button>
            <button class="letra" data-letra="o">O</button>
            <button class="letra" data-letra="p">P</button>
            <button class="letra" data-letra="q">Q</button>
            <button class="letra" data-letra="r">R</button>
            <button class="letra" data-letra="s">S</button>
            <button class="letra" data-letra="t">T</button>
            <button class="letra" data-letra="u">U</button>
            <button class="letra" data-letra="v">V</button>
            <button class="letra" data-letra="w">W</button>
            <button class="letra" data-letra="x">X</button>
            <button class="letra" data-letra="y">Y</button>
            <button class="letra" data-letra="z">Z</button>
          </div>
          <div id="img-exibida" class="img-exibida skeleton">
            <img src="./assets/capa.png" alt="" />
          </div>
        </div>
      </section>
      <section id="palavra">
        <h2>Vamos começar com o seu nome e palavras básicas?</h2>
        <input
          type="text"
          id="input-palavra"
          name="tradutor-libras"
          autocomplete="off"
          placeholder="Digite uma palavra para traduzir"
        />
        <button id="mostrar-img">Mostrar palavra</button>
        <div id="img-palavra" class="img-palavra"></div>
      </section>
    </main>
    <footer>
      <div class="footer-links">
        <a href="https://github.com/Juan-s-moreira">Github</a>
        <a href="https://www.linkedin.com/in/juan-s-moreira/">Linkedin</a>
        <a href="mailto:juan.moreira62@outlook.com">Email</a>
      </div>
      <p>&copy; 2024 Sinais Em Foco. Todos os direitos reservados.</p>
    </footer>

    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.vlibras = new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
    <script type="module" src="./dist/script.js"></script>
  </body>
</html>
